# vim: ft=tmux
# Match Ghostty's Solarized Dark - Vivid palette.
set -g mode-style "fg=#91a8aa,bg=#002831"

set -g message-style "fg=#529ef9,bg=#002831"
set -g message-command-style "fg=#529ef9,bg=#002831"

set -g pane-border-style "fg=#002831"
set -g pane-active-border-style "fg=#529ef9"

set -g popup-style "fg=#91a8aa,bg=#031219"
set -g popup-border-style "fg=#529ef9,bg=#031219"
set -g menu-style "fg=#91a8aa,bg=#031219"
set -g menu-selected-style "fg=#031219,bg=#529ef9,bold"
set -g menu-border-style "fg=#529ef9,bg=#031219"
set -g @floax-border-color "#529ef9"
set -g @floax-text-color "#91a8aa"

set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#91a8aa,bg=#031219"

set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style "none"
set -g status-right-style "none"

set -g status-left "#[fg=#031219,bg=#529ef9,bold] #S #[fg=#529ef9,bg=#031219,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#031219,bg=#031219,nobold,nounderscore,noitalics]#[fg=#529ef9,bg=#031219] #{prefix_highlight} #[fg=#002831,bg=#031219,nobold,nounderscore,noitalics]#[fg=#91a8aa,bg=#002831] %Y-%m-%d  %I:%M %p #[fg=#529ef9,bg=#002831,nobold,nounderscore,noitalics]#[fg=#031219,bg=#529ef9,bold] #h "
if-shell -F '#{==:#{clock-mode-style},24}' {
  set -g status-right "#[fg=#031219,bg=#031219,nobold,nounderscore,noitalics]#[fg=#529ef9,bg=#031219] #{prefix_highlight} #[fg=#002831,bg=#031219,nobold,nounderscore,noitalics]#[fg=#91a8aa,bg=#002831] %Y-%m-%d  %H:%M #[fg=#529ef9,bg=#002831,nobold,nounderscore,noitalics]#[fg=#031219,bg=#529ef9,bold] #h "
}

setw -g window-status-activity-style "underscore,fg=#f8579a,bg=#031219"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#6e8b95,bg=#031219"
setw -g window-status-format "#[fg=#031219,bg=#031219,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#031219,bg=#031219,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#031219,bg=#002831,nobold,nounderscore,noitalics]#[fg=#529ef9,bg=#002831,bold] #I  #W #F #[fg=#002831,bg=#031219,nobold,nounderscore,noitalics]"

set -g @prefix_highlight_output_prefix "#[fg=#d49a0a]#[bg=#031219]#[fg=#031219]#[bg=#d49a0a]"
set -g @prefix_highlight_output_suffix ""
