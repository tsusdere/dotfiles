# Gruvbox Dark palette for tmux.

set -g mode-style "fg=#fabd2f,bg=#3c3836"

set -g message-style "fg=#fabd2f,bg=#3c3836"
set -g message-command-style "fg=#fabd2f,bg=#3c3836"

set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"

set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#ebdbb2,bg=#282828"

set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style "none"
set -g status-right-style "none"

set -g status-left "#[fg=#282828,bg=#fabd2f,bold] #S #[fg=#fabd2f,bg=#282828,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#282828,bg=#282828,nobold,nounderscore,noitalics]#[fg=#fabd2f,bg=#282828] #{prefix_highlight} #[fg=#3c3836,bg=#282828,nobold,nounderscore,noitalics]#[fg=#ebdbb2,bg=#3c3836] %Y-%m-%d  %I:%M %p #[fg=#fabd2f,bg=#3c3836,nobold,nounderscore,noitalics]#[fg=#282828,bg=#fabd2f,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" = "24" ]' {
  set -g status-right "#[fg=#282828,bg=#282828,nobold,nounderscore,noitalics]#[fg=#fabd2f,bg=#282828] #{prefix_highlight} #[fg=#3c3836,bg=#282828,nobold,nounderscore,noitalics]#[fg=#ebdbb2,bg=#3c3836] %Y-%m-%d  %H:%M #[fg=#fabd2f,bg=#3c3836,nobold,nounderscore,noitalics]#[fg=#282828,bg=#fabd2f,bold] #h "
}

setw -g window-status-activity-style "underscore,fg=#d3869b,bg=#282828"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=#a89984,bg=#282828"
setw -g window-status-format "#[fg=#282828,bg=#282828,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#282828,bg=#282828,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#282828,bg=#3c3836,nobold,nounderscore,noitalics]#[fg=#fabd2f,bg=#3c3836,bold] #I  #W #F #[fg=#3c3836,bg=#282828,nobold,nounderscore,noitalics]"

set -g @prefix_highlight_output_prefix "#[fg=#fe8019]#[bg=#282828]#[fg=#282828]#[bg=#fe8019]"
set -g @prefix_highlight_output_suffix ""
